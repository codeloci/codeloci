<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>UAE E-Invoicing — CodeLoci demo</title>
    <meta name="description" content="Invoice, transmit and reconcile — the supplier's system of record for the UAE mandate." />

    <!--
      A mock invoice screen outranking a real client's product page would be worse
      than useless, so every demo is noindex and canonicalises to its case study
      (R-13.3.2). robots.txt also disallows /demos/.
    -->
    <meta name="robots" content="noindex,nofollow" />
    <link rel="canonical" href="https://codeloci.com/work/uae-e-invoicing" />

    <!--
      Sets data-theme, lang and dir before the bundle parses, so a dark-mode visitor never
      sees a white flash. Duplicated logic on purpose: it has to run before React exists.
      The real platform inlines the same thing for the same reason.
    -->
    <script>
      (function () {
        try {
          var k = 'codeloci.demo.uae-e-invoicing.v2.theme';
          var p = new URLSearchParams(location.search).get('theme');
          var m = p || localStorage.getItem(k) || 'dark';
          var d = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
          document.documentElement.style.colorScheme = d ? 'dark' : 'light';
          document.documentElement.style.backgroundColor = d ? '#0a0e12' : '#f4f6f8';
          var l = new URLSearchParams(location.search).get('lang')
            || localStorage.getItem('codeloci.demo.uae-e-invoicing.v2.locale') || 'en';
          document.documentElement.setAttribute('lang', l);
          document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
        } catch (e) { /* storage blocked — the app applies it on mount instead */ }
      })();
    </script>

    <link rel="icon" href="/brand/uae-e-invoicing/favicon.ico" />
    <link rel="apple-touch-icon" href="/brand/uae-e-invoicing/apple-touch-icon-180.png" />
    <script type="module" crossorigin src="/demos/uae-e-invoicing/assets/index-BRh1uKpH.js"></script>
    <link rel="modulepreload" crossorigin href="/demos/uae-e-invoicing/assets/react-CRH2syub.js">
    <link rel="modulepreload" crossorigin href="/demos/uae-e-invoicing/assets/router-CwkzDuqZ.js">
    <link rel="stylesheet" crossorigin href="/demos/uae-e-invoicing/assets/index-DzoDfPmk.css">
  </head>
  <body>
    <noscript>
      This demo is a client-side application and needs JavaScript. The case study it
      belongs to is at <a href="https://codeloci.com/work/uae-e-invoicing">https://codeloci.com/work/uae-e-invoicing</a>.
    </noscript>
    <div id="root"></div>
  </body>
</html>
