    <script>
      // Paint the correct background before React mounts so switching routes or
      // reloading in dark mode never flashes a white page.
      (function () {
        try {
          var stored = localStorage.getItem('codeloci-color-mode');
          var dark =
            stored === 'dark' ||
            (!stored && !window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.setAttribute('data-color-mode', dark ? 'dark' : 'light');
          document.documentElement.style.backgroundColor = dark ? '#080B16' : '#F6F7FB';
        } catch (e) {
          /* storage unavailable — the app applies the theme on mount instead */
        }
      })();
    </script>
