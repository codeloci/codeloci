<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Concentric service arcs crossed by a vertical milestone rule on a blue field.">
  <title>Concentric service arcs crossed by a vertical milestone rule on a blue field.</title>

      <defs>
        <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#2B5CD9" />
          <stop offset="100%" stop-color="#5B86F7" />
        </linearGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#bg)" />
      <rect width="1600" height="900" fill="#000000" opacity="0.14" />
      <!-- eighteen months of service, arc by arc -->
      <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
