<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A waveform clipped inside a closed square, signalling audio that stays put.">
  <title>A waveform clipped inside a closed square, signalling audio that stays put.</title>

      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#334155" />
          <stop offset="100%" stop-color="#64748B" />
