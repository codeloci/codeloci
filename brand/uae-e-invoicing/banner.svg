<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Abstract invoice grid with one tax column highlighted and a transmission node beside it.">
  <title>Abstract invoice grid with one tax column highlighted and a transmission node beside it.</title>

      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#0D6F62" />
          <stop offset="100%" stop-color="#245B86" />
        </linearGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#bg)" />
      
    <defs>
      <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
        <path d="M0 0 H120 M0 0 V64" stroke="#FFFFFF" stroke-width="2" fill="none" />
      </pattern>
    </defs>
    <rect width="1600" height="900" fill="url(#grid)" opacity="0.3" />
      <rect width="1600" height="900" fill="#000000" opacity="0.14" />
      <!-- the highlighted tax column: the one thing this product is about -->
      <rect x="1012" y="180" width="132" height="540" rx="8" fill="#FFFFFF" opacity="0.2" />
      <rect x="1012" y="180" width="132" height="540" rx="8" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.7" />
