        <rect x="1040" y="432" width="76" height="14" rx="7" opacity="0.55" />
        <rect x="1040" y="506" width="76" height="14" rx="7" opacity="1" />
        <rect x="1040" y="580" width="76" height="14" rx="7" opacity="0.55" />
        <rect x="1040" y="654" width="76" height="14" rx="7" opacity="0.55" />
