<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Three arrows closing into a loop over a green field, one arrow returning.">
  <title>Three arrows closing into a loop over a green field, one arrow returning.</title>

      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#15803D" />
          <stop offset="100%" stop-color="#84CC16" />
        </linearGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#bg)" />
      <rect width="1600" height="900" fill="#000000" opacity="0.14" />
      <!-- three columns that must agree, and the one variance that does not -->
      <g>
        <rect x="460" y="280" width="160" height="420" rx="14" fill="#FFFFFF" opacity="0.62" />
        <rect x="720" y="280" width="160" height="420" rx="14" fill="#FFFFFF" opacity="0.62" />
        <rect x="980" y="340" width="160" height="360" rx="14" fill="#FFFFFF" opacity="0.32" />
        <rect x="980" y="220" width="160" height="60" rx="14" fill="#65A30D" />
      </g>
      <path d="M400 700 H1300" stroke="#FFFFFF" stroke-width="8" opacity="0.8" />
      <path d="M400 280 H1300" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="18 14" opacity="0.55" />
</svg>
