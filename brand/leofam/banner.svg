<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A basket silhouette struck through by a forward chevron on a rose field.">
  <title>A basket silhouette struck through by a forward chevron on a rose field.</title>

      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#E11D48" />
          <stop offset="100%" stop-color="#FB7185" />
        </linearGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#bg)" />
      
    <defs>
      <pattern id="handles" width="160" height="160" patternUnits="userSpaceOnUse">
        <path d="M20 120 A 60 60 0 0 1 140 120" fill="none" stroke="#FFFFFF" stroke-width="6" />
      </pattern>
    </defs>
    <rect width="1600" height="900" fill="url(#handles)" opacity="0.2" />
      <rect width="1600" height="900" fill="#000000" opacity="0.14" />
      <!-- a price resolving through three stacked rules -->
      <g fill="#FFFFFF">
        <rect x="420" y="250" width="420" height="18" rx="9" opacity="0.9" />
        <rect x="420" y="330" width="330" height="14" rx="7" opacity="0.6" />
        <rect x="420" y="392" width="270" height="14" rx="7" opacity="0.45" />
        <rect x="420" y="454" width="200" height="14" rx="7" opacity="0.35" />
        <rect x="420" y="540" width="360" height="22" rx="11" />
      </g>
      <g fill="none" stroke="#FB923C" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1000 300 L1120 420 L1000 540" />
      </g>
      <circle cx="1290" cy="420" r="72" fill="#FFFFFF" opacity="0.2" />
      <circle cx="1290" cy="420" r="72" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.7" />
</svg>
